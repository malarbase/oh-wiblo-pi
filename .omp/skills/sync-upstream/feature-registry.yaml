# Intentional divergences — files that upstream owns and we always take upstream for.
divergences:
  - path: "packages/*/CHANGELOG.md"
    reason: "Upstream owns release notes; owp never modifies changelog files."
    resolution: "prefer_upstream"

  - path: "bun.lock"
    reason: "Lockfile is authoritative upstream; run bun install if deps differ."
    resolution: "prefer_upstream"

  - path: "Cargo.lock"
    reason: "Rust lockfile tracks upstream's Cargo.toml changes."
    resolution: "prefer_upstream"

  - path: "MODULE.bazel.lock"
    reason: "Generated Bazel lockfile; regenerate after merges."
    resolution: "prefer_upstream"

  - path: "packages/natives/native/index.js"
    reason: "Built native artifact; regenerated via mise exec -- bun --cwd=packages/natives run build."
    resolution: "prefer_upstream"

  - path: "crates/brush-core-vendored/"
    reason: "Vendored upstream Rust crate."
    resolution: "prefer_upstream"

  - path: "crates/brush-builtins-vendored/"
    reason: "Vendored upstream Rust crate."
    resolution: "prefer_upstream"

  - path: "packages/react-edit-benchmark/"
    reason: "Upstream benchmark tooling."
    resolution: "prefer_upstream"

  - path: "packages/typescript-edit-benchmark/"
    reason: "Upstream benchmark tooling."
    resolution: "prefer_upstream"

  - path: "packages/omp-extension-swarm/"
    reason: "Upstream extension package."
    resolution: "prefer_upstream"

  - path: "packages/omp-stats/"
    reason: "Upstream stats dashboard package."
    resolution: "prefer_upstream"

  - path: "packages/git-tool/"
    reason: "Upstream git tooling package."
    resolution: "prefer_upstream"

  - path: ".turbo/"
    reason: "Generated Turbo cache artifacts; should not be tracked."
    resolution: "prefer_upstream"

  - path: "Dockerfile.robomp"
    reason: "Fork removes upstream robomp Docker builder."
    resolution: "prefer_ours"

  - path: "Dockerfile.robomp.dockerignore"
    reason: "Fork removes upstream robomp Docker builder context."
    resolution: "prefer_ours"

  - path: "python/robomp/"
    reason: "Fork removes upstream robomp GitHub triage bot."
    resolution: "prefer_ours"

  - path: "packages/hashline/"
    reason: "Upstream nativized hashline into crates/pi-edit (18.2.x) and dropped the JS package; the fork adopted the native engine and retired its JS pipeline (2026-09-21)."
    resolution: "prefer_upstream"

