# OWP Feature Registry — Single source of truth for fork-owned files and divergences.
# Both SKILL.md and sync.ts consume this file.
# Add new features here, then regenerate SKILL.md with:
#   bun .omp/skills/sync-upstream/generate-skill-md.ts
#
# Optional per-feature field: obsoleted_fixes
#   - pre_rebase_hash:      string (the hash before rebase)
#   - description:          string (what the fix did)
#   - upstream_obsoleted_in: string (upstream commit hash where it became obsolete)
# Use this to suppress false-positive dropped-commit warnings when upstream
# independently applied the same fix.
#
# Optional per-feature field: protecting_tests
#   - list of test files (bun test targets) that must pass for this feature to
#     count as preserved. `--verify` runs them; a red test is a feature-loss
#     alarm that survives upstream refactors (unlike symbol greps).

# Fork commit count at the last verified rebuild/rebase. `--verify` fails if
# `git rev-list --count upstream/main..main` drifts from this without a
# deliberate registry update (rebuild, merge, or intentional commit drop).
expected_fork_commit_count: 69

